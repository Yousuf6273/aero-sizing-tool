[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosizing"
version = "0.1.0"
description = "Research-grounded aircraft performance/sizing and rocket trajectory tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
include = ["aerosizing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
